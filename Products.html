<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SweetBakes – Products</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .product-card {
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    }

    /* Cart Drawer */g
    #cartDrawer {
      transition: right 0.35s ease-in-out;
    }
  </style>
</head>

<body class="bg-[#faf5f0]">

  <!-- NAVBAR -->
  <nav class="w-full bg-white shadow-sm px-6 py-4 flex justify-between items-center">
    <h1 class="text-2xl font- text-brown-550">Sweet<b>Bakes</b></h1>

    <ul class="hidden md:flex space-x-8 text-lg">
      <li><a href="#" class="hover:text-brown-550">Home</a></li>
      <li><a href="#" class="text-brown-600 border-b-2 border-brown-600">Products</a></li>
      <li><a href="#" class="hover:text-brown-550">About</a></li>
      <li><a href="#" class="hover:text-brown-550">Contact</a></li>
    </ul>

    <button onclick="openCart()" class="bg-red-500 text-white px-4 py-2 rounded-full">
      🛒 Cart <span id="cartCount">0</span>
    </button>
  </nav>

  <!-- HERO -->
  <section class="px-6 md:px-12 py-12">
    <p class="uppercase tracking-widest text-brown-500">Our Menu</p>

    <h2 class="text-4xl md:text-5xl font-bold mt-2">
      Everything We Bake
    </h2>
  </section>

  <!-- SEARCH -->
  <div class="px-6 md:px-12">
    <div class="w-full md:w-1/2">
      <input type="text" id="searchInput" placeholder="Search cakes, pastries, breads…"
        onkeyup="renderProducts()"
        class="w-full px-5 py-3 rounded-full border border-gray-300 focus:ring-2 focus:ring-brown-300" />
    </div>
  </div>

  <!-- CATEGORIES -->
  <div class="px-6 md:px-12 mt-6 flex flex-wrap gap-4">
    <button onclick="setCategory('all')" class="cat-btn bg-brown-650 text-white px-5 py-2 rounded-full">All Items</button>
    <button onclick="setCategory('cake')" class="cat-btn bg-white border px-5 py-2 rounded-full">🍰 Cakes</button>
    <button onclick="setCategory('pastry')" class="cat-btn bg-white border px-5 py-2 rounded-full">🥐 Pastries</button>
    <button onclick="setCategory('cookies')" class="cat-btn bg-white border px-5 py-2 rounded-full">🍪 Cookies</button>
    <button onclick="setCategory('bread')" class="cat-btn bg-white border px-5 py-2 rounded-full">🍞 Bread</button>
    <button onclick="setCategory('pizza')" class="cat-btn bg-white border px-5 py-2 rounded-full">🍕 Pizza</button>
    <button onclick="setCategory('burger')" class="cat-btn bg-white border px-5 py-2 rounded-full">🍔 Burgers</button>
    <button onclick="setCategory('puffs')" class="cat-btn bg-white border px-5 py-2 rounded-full">🥖 Puffs</button>
    <button onclick="setCategory('chocolate')" class="cat-btn bg-white border px-5 py-2 rounded-full">🍫 Chocolate</button>
    <button onclick="setCategory('juice')" class="cat-btn bg-white border px-5 py-2 rounded-full">🥤 Juices</button>
  </div>

  <!-- PRODUCT GRID -->
  <section id="productList"
    class="px-6 md:px-12 mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
  </section>

  <!-- CART DRAWER -->
  <div id="cartDrawer"
    class="fixed top-0 right-[-400px] h-full w-80 bg-white shadow-xl p-5 overflow-y-auto z-50">

    <div class="flex justify-between items-center mb-5">
      <h2 class="text-2xl font-bold">Your Cart</h2>
      <button onclick="closeCart()" class="text-2xl">✖</button>
    </div>

    <div id="cartItems"></div>

    <div class="mt-5 border-t pt-3">
      <p class="text-xl font-bold">Total: ₹<span id="cartTotal">0</span></p>
    </div>
  </div>

  <!-- ADMIN PANEL: OPEN BY typing #admin IN URL -->
  <div id="adminPanel" class="hidden p-6">

    <h2 class="text-3xl font-bold mb-4">Admin Panel</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- ADD PRODUCT -->
      <div class="bg-white p-5 rounded-xl shadow">
        <h3 class="text-xl font-bold mb-3">Add New Product</h3>

        <input id="aName" class="block w-full p-3 border rounded mb-2" placeholder="Product Name" />
        <input id="aPrice" class="block w-full p-3 border rounded mb-2" placeholder="Price" />
        <input id="aImg" class="block w-full p-3 border rounded mb-2" placeholder="Image URL" />
        <select id="aCat" class="block w-full p-3 border rounded mb-2">
          <option value="cake">Cake</option>
          <option value="pastry">Pastry</option>
          <option value="cookies">Cookies</option>
          <option value="bread">Bread</option>
          <option value="pizza">Pizza</option>
          <option value="burger">Burger</option>
          <option value="puffs">Puffs</option>
          <option value="chocolate">Chocolate</option>
          <option value="juice">Juice</option>
        </select>

        <button onclick="addNewProduct()" class="bg-brown-650 text-white px-4 py-2 rounded">Add Product</button>
      </div>

      <!-- EDIT / DELETE PRODUCT -->
      <div class="bg-white p-5 rounded-xl shadow">
        <h3 class="text-xl font-bold mb-3">Manage Products</h3>
        <div id="adminProductList"></div>
      </div>

    </div>
  </div>

  <!-- JS -->
  <script>

    /* -------------------------
         PRODUCT DATABASE (40 ITEMS)
    ----------------------------- */

    let products = JSON.parse(localStorage.getItem("products")) || [
      { id: 1, name: "Chocolate Truffle Cake", price: 749, category: "cake", img: "Images/ChocolateTruffleCake_1800x1800.webp" },
      { id: 2, name: "Black Forest Cake", price: 899, category: "cake", img: "Images/Blackforest.jpg" },
      { id: 3, name: "Red Velvet Cake", price: 799, category: "cake", img: "Images/redvelevt cake.jpg" },
      { id: 4, name: "Fruit Cake", price: 220, category: "cake", img: "Images/FRUITCAKES.jpg" },

      { id: 5, name: "Chocolate Pastry", price: 80, category: "pastry", img: "Images/choco pastry.jpg", onclick: "imgClick(this)" },
      { id: 6, name: "Strawberry Pastry", price: 75, category: "pastry", img: "Images/strawberry pastry.jpeg" },
      { id: 7, name: "Black Forest Pastry", price: 70, category: "pastry", img: "Images/black forest.jpg" },
      { id: 8, name: "Pineapple Pastry", price: 70, category: "pastry", img: "Images/pineapple pastry.jpeg" },

      // COOKIES
      { id: 9, name: "Butter Cookies", price: 120, category: "cookies", img: "Images/butter cookies.jpeg" },
      { id: 10, name: "Chocolate Chip Cookies", price: 140, category: "cookies", img: "Images/WhatsApp Image 2026-05-23 at 00.07.24 (1).jpeg" },
      { id: 11, name: "Oatmeal Cookies", price: 150, category: "cookies", img: "Images/WhatsApp Image 2026-05-23 at 00.07.24.jpeg" },
      { id: 12, name: "Dry Fruit Cookies", price: 160, category: "cookies", img: "Images/dryfruit cookies.jpeg " },

      // BREAD
      { id: 13, name: "Milk Bread", price: 40, category: "bread", img: "Images/milkbread.webp" },
      { id: 14, name: "Garlic Bread", price: 90, category: "bread", img: "Images/galicabread.webp" },
      { id: 15, name: "Brown Bread", price: 50, category: "bread", img: "Images/Brownbread.webp" },
      { id: 16, name: "Sweet Bun", price: 30, category: "bread", img: "Images/solucionindividual-bun-706375_1920.jpg " },

      // PIZZA
      { id: 17, name: "Veg Pizza", price: 180, category: "pizza", img: "Images/160450-italian-food-pizza-ingredientes-wallpaper-1920x1080-1286188.jpg" },
      { id: 18, name: "Cheese Pizza", price: 200, category: "pizza", img: " Images/268475-cheese-pizza-wallpaper-mobile-free-download-good-pizza-food.jpg" },
      { id: 19, name: "Paneer Pizza", price: 220, category: "pizza", img: "Images/285951-pizza-wallpaper.jpg" },
      { id: 20, name: "Corn Pizza", price: 170, category: "pizza", img: " Images/396739-pizza-wallpaper-2560x1600.jpg" },

      // BURGER
      { id: 21, name: "Veg Burger", price: 90, category: "burger", img:"Images/VEGBurger.jpg" },
      { id: 22, name: "spicy Burger", price: 120, category: "burger", img: "Images/Dobulepattburger.jpg" },
      { id: 23, name: "Cheese Burger", price: 110, category: "burger", img: "Images/CHBurger.jpg" },
      { id: 24, name: "Combo Burger", price: 130, category: "burger", img:"Images/ComboBurger.jpg" },

      // PUFFS
      { id: 25, name: "Veg Puff", price: 35, category: "puffs", img: "Images/pexels-amaria-16406502.jpg" },
      { id: 26, name: "Paneer Puff", price: 50, category: "puffs", img: "Images/panner puffs.jpg " },
      { id: 27, name: "Egg Puff", price: 40, category: "puffs", img: "Images/eggs-puffs.jpg " },
      { id: 28, name: "Chicken Puff", price: 60, category: "puffs", img: "Images/chicken puffs.jpg " },

      // CHOCOLATE
      { id: 29, name: "Dark Chocolate", price: 90, category: "chocolate", img: "Images/pexels-alleksana-4113333.jpg" },
      { id: 30, name: "Milk Chocolate", price: 85, category: "chocolate", img: "Images/milk-chocolates.webp" },
      { id: 31, name: "Hazelnut Chocolate", price: 120, category: "chocolate", img: "Images/pexels-polina-tankilevitch-4110094.jpg" },
      { id: 32, name: "Chocolate Bar", price: 70, category: "chocolate", img: "Images/chocolte-bar.webp" },

      // JUICE
      { id: 33, name: "Orange Juice", price: 60, category: "juice", img: "Images/orange juice.jpg" },
      { id: 34, name: "Apple Juice", price: 55, category: "juice", img: "Images/front-view-fresh-apple-juice-with-fresh-apples-dark-drink-photo-color-cocktail-fruit.jpg" },
      { id: 35, name: "Mango Juice", price: 70, category: "juice", img: "Images/mango juice.jpg" },
      { id: 36, name: "Pineapple Juice", price: 60, category: "juice", img: "Images/pineapple-juice-with-pieces-raw-pineapple.jpg" },

    ];

    /* SAVE */
    function saveProducts() {
      localStorage.setItem("products", JSON.stringify(products));
    }

    /* CATEGORY + SEARCH */
    let activeCategory = "all";
    function setCategory(cat) {
      activeCategory = cat;
      renderProducts();
    }

    /* RENDER PRODUCTS */
    function renderProducts() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const list = document.getElementById("productList");

      list.innerHTML = "";

      products
        .filter(p =>
          (activeCategory === "all" || p.category === activeCategory) &&
          p.name.toLowerCase().includes(search)
        )
        .forEach(p => {
          list.innerHTML += `
            <div class="product-card bg-white rounded-2xl p-5">
              <span class="text-sm bg-rose-100 px-3 py-1 rounded-full uppercase">${p.category}</span>

              <img src="${p.img}" class="w-50 mx-auto mt-5" />

              <h3 class="text-xl font-semibold mt-4">${p.name}</h3>
              <p class="text-gray-600">Fresh & delicious…</p>

              <div class="flex justify-between items-center mt-5">
                <p class="text-red-700 text-lg font-bold">₹${p.price}</p>
                <button onclick="addToCart(${p.id})"
                     class="bg-red-600 text-white px-4 py-2 rounded-full">+ Add</button>
              </div>
            </div>
          `;
        });
    }

    renderProducts(); // load on start

    /* -------------------------
         CART SYSTEM
    ----------------------------- */

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function saveCart() {
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function openCart() {
      document.getElementById("cartDrawer").style.right = "0px";
    }

    function closeCart() {
      document.getElementById("cartDrawer").style.right = "-400px";
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      const exists = cart.find(c => c.id === id);

      if (exists) exists.qty++;
      else cart.push({ ...item, qty: 1 });

      saveCart();
      updateCartUI();
    }

    function updateCartUI() {
      const cartItems = document.getElementById("cartItems");
      const cartCount = document.getElementById("cartCount");
      const cartTotal = document.getElementById("cartTotal");

      cartItems.innerHTML = "";
      let total = 0;
      cartCount.textContent = cart.reduce((a, b) => a + b.qty, 0);

      cart.forEach(c => {
        total += c.qty * c.price;

        cartItems.innerHTML += `
          <div class="flex justify-between items-center mb-3">
            <div>
              <p class="font-semibold">${c.name}</p>
              <p class="text-sm text-gray-600">₹${c.price} × ${c.qty}</p>
            </div>

            <div>
              <button onclick="changeQty(${c.id}, -1)" class="px-2">➖</button>
              <button onclick="changeQty(${c.id}, 1)" class="px-2">➕</button>
            </div>
          </div>
        `;
      });

      cartTotal.textContent = total;
      saveCart();
    }

    function changeQty(id, val) {
      const item = cart.find(c => c.id === id);

      if (!item) return;

      item.qty += val;

      if (item.qty <= 0)
        cart = cart.filter(c => c.id !== id);

      updateCartUI();
    }

    updateCartUI();

    /* --------------------------
        ADMIN PANEL (#admin)
    ---------------------------- */

    function checkAdmin() {
      if (location.hash === "#admin") {
        document.getElementById("adminPanel").classList.remove("hidden");
        renderAdminProducts();
      }
    }
    checkAdmin();

    window.onhashchange = checkAdmin;

    function renderAdminProducts() {
      const panel = document.getElementById("adminProductList");
      panel.innerHTML = "";

      products.forEach(p => {
        panel.innerHTML += `
          <div class="flex justify-between items-center border-b py-2">
            <p>${p.name}</p>
            <div>
              <button onclick="deleteProduct(${p.id})" class="text-red-600">Delete</button>
            </div>
          </div>
        `;
      });
    }

    function addNewProduct() {
      const name = document.getElementById("aName").value;
      const price = document.getElementById("aPrice").value;
      const img = document.getElementById("aImg").value;
      const cat = document.getElementById("aCat").value;

      products.push({
        id: Date.now(),
        name,
        price,
        img,
        category: cat
      });

      saveProducts();
      renderProducts();
      renderAdminProducts();
      alert("Product Added!");
    }

    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      saveProducts();
      renderProducts();
      renderAdminProducts();
    }

  </script>

</body>
</html>
